<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>区域配置工具 - 校园美食推荐助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f5f5;
    }
    .container {
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 350px;
      background: white;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 2px 0 8px rgba(0,0,0,0.1);
    }
    .map-container {
      flex: 1;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #333;
    }
    .section {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }
    .section:last-child {
      border-bottom: none;
    }
    h2 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #667eea;
    }
    .btn {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    .btn-primary {
      background: #667eea;
      color: white;
    }
    .btn-primary:hover {
      background: #5568d3;
    }
    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }
    .btn-secondary:hover {
      background: #d0d0d0;
    }
    .btn-danger {
      background: #f44336;
      color: white;
    }
    .btn-danger:hover {
      background: #d32f2f;
    }
    .area-item {
      background: #f9f9f9;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 4px;
      border-left: 4px solid #667eea;
    }
    .area-name {
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }
    .area-info {
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }
    .area-actions {
      margin-top: 10px;
      display: flex;
      gap: 5px;
    }
    .area-actions button {
      flex: 1;
      padding: 6px;
      font-size: 12px;
      margin: 0;
    }
    .input-group {
      margin-bottom: 15px;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #555;
    }
    .input-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    .tip {
      background: #fff3cd;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      color: #856404;
      margin-bottom: 15px;
    }
    .status {
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 13px;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
    }
    code {
      display: block;
      background: #f4f4f4;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      overflow-x: auto;
      margin-top: 10px;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 侧边栏 -->
    <div class="sidebar">
      <h1>🗺️ 区域配置工具</h1><p id="notice" role="status">正在读取后端配置…</p>

      <div class="section">
        <h2>操作步骤</h2>
        <div class="tip">
          <strong>如何使用：</strong><br>
          1. 选择区域名称<br>
          2. 点击"开始绘制"按钮<br>
          3. 在地图上按住鼠标拖动绘制<br>
          4. 点击"保存区域"，不满意可重新绘制<br>
          5. 点击“保存到后端”立即应用；也可下载 JSON
        </div>
      </div>

      <div class="section">
        <h2>新建区域</h2>
        <div class="input-group">
          <label>区域名称</label>
          <select id="areaName"><option>学校食堂</option><option>南门</option><option>西门龙湖时代天街</option></select><p>重新绘制同名区域会替换旧边界。</p>
        </div>
        <button class="btn btn-primary" onclick="startDrawing('circle')">🔵 开始绘制（圆形）</button>
        <button class="btn btn-primary" onclick="startDrawing('rectangle')">⬜ 开始绘制（矩形）</button>
        <button class="btn btn-primary" onclick="startDrawing('polygon')">沿边界绘制（多边形）</button><p>多边形逐点点击，双击结束；重叠处归属距离区域中心更近的区域。</p><button class="btn btn-secondary" onclick="cancelDrawing()">取消绘制</button>
      </div>

      <div class="section" id="currentDrawing" style="display:none;">
        <h2>当前绘制</h2>
        <div id="drawingStatus" class="status info"></div>
        <button class="btn btn-primary" onclick="saveCurrentArea()">💾 保存区域</button>
      </div>

      <div class="section">
        <h2>已保存区域</h2>
        <div id="areasList"></div>
      </div>

      <div class="section">
        <h2>导出配置</h2>
        <button class="btn btn-primary" onclick="saveToBackend()">💾 保存到后端（推荐）</button>
        <button class="btn btn-secondary" onclick="exportConfig()">📋 预览 JSON</button>
        <button class="btn btn-secondary" onclick="downloadConfig()">下载 JSON</button><pre id="configOutput" style="white-space:pre-wrap"></pre>
      </div>
    </div>

    <!-- 地图 -->
    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script>
    let map, mouseTool, currentOverlay, drawingType, dirty = false, busy = false;
    let areas = [];
    const style = {fillColor:'#667eea', fillOpacity:0.25, strokeColor:'#667eea', strokeWeight:2};
    const notice = text => document.getElementById('notice').textContent = text;
    async function api(path, options) {
      const response = await fetch(path, options);
      const data = await response.json();
      if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail));
      return data;
    }
    function makeOverlay(config) {
      const shape = config.type === 'polygon' ? new AMap.Polygon({...style, path:config.path}) : config.type === 'rectangle'
        ? new AMap.Rectangle({...style, bounds:new AMap.Bounds(config.bounds[0], config.bounds[1])})
        : new AMap.Circle({...style, center:config.location.split(',').map(Number), radius:config.radius});
      map.add(shape); return shape;
    }
    async function init() {
      if (location.protocol === 'file:') { location.replace('http://127.0.0.1:8000/area-config'); return; }
      try {
        const saved = await api('/api/admin/areas');
        areas = Object.entries(saved.areas).map(([name, config]) => ({name, config}));
        renderAreas();
        const config = await api('/api/admin/map-config');
        if (!config.key) throw new Error('请先配置前端地图 Key');
        if (config.securityJsCode) window._AMapSecurityConfig = {securityJsCode:config.securityJsCode};
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          const timer = setTimeout(() => reject(new Error('地图加载超时，请检查网络及地图 Key / securityJsCode')), 15000);
          script.src = 'https://webapi.amap.com/maps?v=2.0&key=' + encodeURIComponent(config.key);
          script.onload = () => {clearTimeout(timer); resolve();};
          script.onerror = () => {clearTimeout(timer); reject(new Error('地图脚本加载失败'));};
          document.head.append(script);
        });
        map = new AMap.Map('map', {zoom:15, center:[103.9348,30.7606]});
        await new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error('绘图插件加载超时')), 15000);
          AMap.plugin(['AMap.MouseTool','AMap.Scale','AMap.ToolBar'], () => {clearTimeout(timer); resolve();});
        });
        mouseTool = new AMap.MouseTool(map);
        map.addControl(new AMap.Scale()); map.addControl(new AMap.ToolBar());
        mouseTool.on('draw', e => {
          currentOverlay = e.obj; mouseTool.close(false);
          document.getElementById('currentDrawing').style.display = 'block';
          document.getElementById('drawingStatus').textContent = '绘制完成，点击保存区域加入待提交配置。';
        });
        areas.forEach(area => area.overlay = makeOverlay(area.config));
        notice(config.securityJsCode ? '已连接后端，配置已加载。' : '已读取配置。尚未配置 securityJsCode；若地图空白，请补充对应安全密钥。');
      } catch (error) { notice(error.message); }
    }
    function startDrawing(type) {
      if (!mouseTool) {notice('地图绘图工具尚未就绪，请检查地图配置。'); return;}
      if (busy) return;
      cancelDrawing(); drawingType = type;
      mouseTool[type](style); notice(type === 'polygon' ? '沿校园边界逐点点击，双击结束。' : '在地图上按住鼠标拖动绘制区域。');
    }
    function cancelDrawing() {
      if (mouseTool) mouseTool.close(false);
      if (currentOverlay) map.remove(currentOverlay);
      currentOverlay = null;
      document.getElementById('currentDrawing').style.display = 'none';
    }
    function saveCurrentArea() {
      if (!currentOverlay || busy) return;
      const name = document.getElementById('areaName').value;
      let center, radius, bounds, path;
      if (drawingType === 'polygon') {
        const points = currentOverlay.getPath(); path = points.map(p => [p.getLng(),p.getLat()]);
        center = currentOverlay.getBounds().getCenter(); radius = Math.ceil(Math.max(...points.map(p => center.distance(p))));
      } else if (drawingType === 'rectangle') {
        const b = currentOverlay.getBounds(); center = b.getCenter();
        const sw = b.getSouthWest(), ne = b.getNorthEast();
        bounds = [[sw.getLng(),sw.getLat()],[ne.getLng(),ne.getLat()]];
        radius = Math.ceil(Math.max(center.distance(sw),center.distance(ne)));
      } else { center = currentOverlay.getCenter(); radius = Math.ceil(currentOverlay.getRadius()); }
      if (!Number.isFinite(radius) || radius < 1 || radius > 5000) {notice('覆盖半径必须在 1–5000 米，请重新绘制。'); return;}
      const config = {type:drawingType, location:center.getLng().toFixed(6)+','+center.getLat().toFixed(6), radius};
      if (bounds) config.bounds = bounds;
      if (path) config.path = path;
      const previous = areas.find(a => a.name === name);
      if (previous?.overlay) map.remove(previous.overlay);
      areas = areas.filter(a => a.name !== name);
      areas.push({name, config, overlay:currentOverlay}); currentOverlay = null;
      mouseTool.close(false); dirty = true; renderAreas();
      document.getElementById('currentDrawing').style.display = 'none';
      notice('区域已加入草稿，请点击保存到后端。');
    }
    function renderAreas() {
      const list = document.getElementById('areasList'); list.replaceChildren();
      areas.forEach((area, index) => {
        const card = document.createElement('div'); card.className = 'area-item';
        const title = document.createElement('div'); title.textContent = area.name; card.append(title);
        const info = document.createElement('p'); info.textContent = `${area.config.type === 'polygon' ? '多边形' : area.config.type === 'rectangle' ? '矩形' : '圆形'} · ${area.config.location} · 覆盖半径 ${area.config.radius} 米`; card.append(info);
        for (const [label, handler] of [['定位', () => locateArea(index)], ['删除', () => deleteArea(index)]]) {
          const button = document.createElement('button'); button.className = 'btn btn-secondary'; button.textContent = label; button.onclick = handler; card.append(button);
        }
        list.append(card);
      });
    }
    function locateArea(index) { if (map) map.setCenter(areas[index].config.location.split(',').map(Number)); }
    function deleteArea(index) {
      if (busy) return;
      if (areas.length <= 1) {notice('至少保留一个区域。'); return;}
      if (areas[index].overlay) map.remove(areas[index].overlay);
      areas.splice(index,1); dirty = true; renderAreas(); notice('已从草稿删除，保存到后端后生效。');
    }
    function configuration() { return Object.fromEntries(areas.map(a => [a.name,a.config])); }
    async function saveToBackend() {
      if (busy) return;
      if (currentOverlay) {notice('请先保存或取消当前绘制。'); return;}
      if (!areas.length) {notice('至少保留一个区域。'); return;}
      busy = true;
      try {
        const result = await api('/api/admin/areas', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({areas:configuration()})});
        areas.forEach(a => a.config = result.areas[a.name]);
        dirty = false; renderAreas(); notice('已保存到后端 JSON，下一次餐厅查询立即使用新边界。');
      } catch (error) {notice('保存失败：'+error.message);} finally {busy = false;}
    }
    function exportConfig() { document.getElementById('configOutput').textContent = JSON.stringify(configuration(),null,2); }
    function downloadConfig() {
      const url = URL.createObjectURL(new Blob([JSON.stringify(configuration(),null,2)],{type:'application/json'}));
      const link = document.createElement('a'); link.href = url; link.download = 'area_config.json'; link.click(); setTimeout(() => URL.revokeObjectURL(url),1000);
    }
    window.addEventListener('beforeunload', e => {if (dirty || currentOverlay) {e.preventDefault(); e.returnValue = '';}});
    init();
  </script>
</body>
</html>
